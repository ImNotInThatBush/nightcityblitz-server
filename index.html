<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night City Blitz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #f0f0f0;
            font-family: 'Russo One', sans-serif;
            overflow: hidden;
        }
        #bg-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -100;
        }
        #video-bg, #wallpaper-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: fill;
            transition: opacity 0.5s ease-in-out;
        }
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            cursor: none;
        }
    </style>
</head>
<body>
    <div id="bg-container">
        <video autoplay muted loop playsinline id="video-bg">
            <source src="https://res.cloudinary.com/dqupgoj0r/video/upload/videoplayback_online-video-cutter.com_femz3y.mp4" type="video/mp4">
        </video>
        <img id="wallpaper-bg" src="" style="opacity: 0;">
    </div>

    <audio id="menu-music" loop src="https://res.cloudinary.com/dqupgoj0r/video/upload/v1760418412/SAMURAI_-_Chippin_In_Cyberpunk_2077_OST_kaenad.mp3"></audio>
    <audio id="game-music"></audio>

    <div id="ui-layer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; align-items: center; justify-content: center; z-index: 10;">
        
        <!-- ADMIN OVERLAY -->
        <div id="admin-overlay" style="background: rgba(10, 0, 5, 0.95); border: 2px solid #ff003c; padding: 40px; width: 80%; max-height: 80%; overflow-y: auto; text-align: center; box-shadow: 0 0 20px rgba(255,0,60,0.5); display: none; pointer-events: auto;">
            <h1 style="color: #ff003c; margin-top: 0; text-transform: uppercase; text-shadow: 0 0 10px #ff003c;">Terminale Amministratore</h1>
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <button id="admin-refresh-btn" style="background: #fcee0a; color: #000; font-family: 'Russo One', sans-serif; padding: 10px 20px; border: none; cursor: pointer;">AGGIORNA LISTA</button>
                <button id="admin-close-btn" style="background: #ff003c; color: #000; font-family: 'Russo One', sans-serif; padding: 10px 20px; border: none; cursor: pointer;">CHIUDI</button>
            </div>
            <table style="width: 100%; color: #e1f5fe; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="border-bottom: 2px solid #ff003c; color: #fcee0a;">
                        <th style="padding: 10px;">ID</th>
                        <th style="padding: 10px;">Nickname</th>
                        <th style="padding: 10px;">Win / Loss</th>
                        <th style="padding: 10px;">Status</th>
                        <th style="padding: 10px;">Azioni</th>
                    </tr>
                </thead>
                <tbody id="admin-players-list">
                    <!-- Populated via JS -->
                </tbody>
            </table>
        </div>

    </div>

    <canvas id="gameCanvas"></canvas>

    <script type="module" src="src/game.js?v=21"></script>
</body>
</html>
